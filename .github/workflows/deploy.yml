name: Deploy OS Clients to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build BackendOS
        working-directory: BackendOS/client
        run: |
          npm install
          npm run build

      - name: Build SimpleOS
        working-directory: SimpleOS/client
        run: |
          npm install
          npm run build

      - name: Build NanoOS
        working-directory: NanoOS/client
        run: |
          npm install
          npm run build

      - name: Build Bindows
        working-directory: Bindows/client
        run: |
          npm install
          npm run build

      - name: Build AutonomousOS
        working-directory: AutonomousOS/client
        run: |
          npm install
          npm run build

      - name: Build WebXOS
        working-directory: WebXOS/client
        run: |
          npm install
          npm run build

      - name: Build WebXOs Luncher
        working-directory: WebXOsLuncher
        run: |
          npm install
          npm run build

      - name: Assemble Pages
        run: |
          mkdir -p _site/backend-os
          mkdir -p _site/simple-os
          mkdir -p _site/nano-os
          mkdir -p _site/bindows
          mkdir -p _site/autonomous
          mkdir -p _site/web-xos
          cp -r BackendOS/client/dist/* _site/backend-os/
          cp -r SimpleOS/client/dist/* _site/simple-os/
          cp -r NanoOS/client/dist/* _site/nano-os/
          cp -r Bindows/client/dist/* _site/bindows/
          cp -r AutonomousOS/client/dist/* _site/autonomous/
          cp -r WebXOS/client/dist/* _site/web-xos/
          # Luncher becomes the site root (replaces old static index.html, but keep fallback)
          cp -r WebXOsLuncher/dist/* _site/
          # Also keep copy at /luncher for direct access
          mkdir -p _site/luncher
          cp -r WebXOsLuncher/dist/* _site/luncher/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
